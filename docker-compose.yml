services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../Frontend
    expose:
      - "80"

  backend:
    build:
      context: ../Backend
    expose:
      - "4000"
    env_file:
      - ../Backend/.env
    # Pisa los valores del .env local, que apuntan al desarrollo sin Docker
    # (Vite en :5173, backend en :4000). Dentro del stack todo entra por Nginx
    # en http://localhost, así que Better Auth tiene que verlo así o rechaza
    # el origen de las peticiones. `environment` pisa `env_file`; se deja debajo por legibilidad.
    environment:
      BETTER_AUTH_URL: http://localhost
      TRUSTED_ORIGINS: http://localhost
      # Sin LLM en el stack de Docker (HU-26). El .env del Backend puede traer la
      # key del AI Gateway, que es UNA sola para los tres integrantes con US$ 5
      # por mes: si llegara hasta aca, cada corrida de los E2E le pegaria al
      # modelo de verdad y gastaria credito compartido, y encima con respuestas
      # distintas en cada corrida. Vacias, el asistente contesta en modo
      # limitado (HU-28): deterministico, gratis, y es lo que prueban los E2E.
      # Se pisan las dos porque el backend acepta cualquiera de los dos nombres.
      # Para probar el asistente de verdad, `npm run dev` en Backend, sin Docker.
      LLM_API_KEY: ""
      AI_GATEWAY_API_KEY: ""
      # Piso de ventas para que el analisis de HU-27 hable de rotacion. En
      # produccion son 3: con menos no hay con que comparar un producto contra
      # otro y el asistente lo dice (`sin_historial`) en vez de inventar.
      #
      # Acá va en 1 porque cada test E2E arranca con su propio comercio vacio y
      # tiene que fabricar el historial entero por API: con el piso en 3 harian
      # falta tres ventas de andamiaje para llegar al mismo escenario, o sea
      # tres viajes mas a Neon por test para no probar nada distinto.
      #
      # Lo que SI sigue probandose con el valor real es el piso en si: el test
      # de `sin_historial` corre con cero ventas, que esta por debajo de
      # cualquiera de los dos valores. El umbral exacto (3) lo cubren los
      # unitarios de Backend/tests/asistente.recomendaciones.test.js.
      #
      # `RECOMENDACIONES_DIAS` NO se pisa a proposito: queda en su default de 30
      # dias, que es la ventana de produccion y la unica que esta suite
      # ejercita de verdad.
      RECOMENDACIONES_VENTAS_MINIMAS: "1"
