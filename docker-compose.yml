services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../Frontend
    expose:
      - "80"

  backend:
    build:
      context: ../Backend
    expose:
      - "4000"
    env_file:
      - ../Backend/.env
    # Pisa los valores del .env local, que apuntan al desarrollo sin Docker
    # (Vite en :5173, backend en :4000). Dentro del stack todo entra por Nginx
    # en http://localhost, así que Better Auth tiene que verlo así o rechaza
    # el origen de las peticiones. `environment` pisa `env_file`; se deja debajo por legibilidad.
    environment:
      BETTER_AUTH_URL: http://localhost
      TRUSTED_ORIGINS: http://localhost
      # Sin LLM en el stack de Docker (HU-26). El .env del Backend puede traer la
      # key del AI Gateway, que es UNA sola para los tres integrantes con US$ 5
      # por mes: si llegara hasta aca, cada corrida de los E2E le pegaria al
      # modelo de verdad y gastaria credito compartido, y encima con respuestas
      # distintas en cada corrida. Vacias, el asistente contesta en modo
      # limitado (HU-28): deterministico, gratis, y es lo que prueban los E2E.
      # Se pisan las dos porque el backend acepta cualquiera de los dos nombres.
      # Para probar el asistente de verdad, `npm run dev` en Backend, sin Docker.
      LLM_API_KEY: ""
      AI_GATEWAY_API_KEY: ""