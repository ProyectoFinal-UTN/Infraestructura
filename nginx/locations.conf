# Reglas de enrutamiento compartidas entre el server block HTTP (80) y el
# HTTPS (443, ver README para como generar el cert local con mkcert). Un solo
# lugar para no tener que mantener los dos bloques en sincro a mano.

# OJO con la barra final en proxy_pass, ver nginx.conf para la explicacion
# completa: sin barra preserva la URL completa (/api/auth/x llega igual con y
# sin Docker).
location /api/ {
  proxy_pass http://backend;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# El health del backend vive en /health, no en /api/health. Se expone aparte
# porque la location / lo mandaria al frontend.
location = /health {
  proxy_pass http://backend/health;
  proxy_set_header Host $host;
}

location = /api-docs {
  return 301 /api-docs/;
}

location /api-docs/ {
  proxy_pass http://backend/api-docs/;
  proxy_set_header Host $host;
}

# El Frontend es una SPA: el build son archivos estaticos y las rutas
# (/productos, /login, ...) las resuelve React Router en el navegador, no
# existen como archivo. El contenedor `frontend` corre el Nginx por defecto,
# que ante /productos busca ese archivo, no lo encuentra y devuelve 404: entrar
# por un link directo o apretar F5 en cualquier pantalla rompia la app.
#
# La solucion es el fallback tipico de SPA: cuando el upstream contesta 404, se
# sirve index.html y el router se encarga del resto. En produccion no hace
# falta porque el Frontend vive en Vercel, que hace este rewrite solo; este
# stack tiene que igualar ese comportamiento para valer como prueba de
# integracion.
location / {
  proxy_pass http://frontend/;
  proxy_set_header Host $host;

  # El `=` cambia el 404 por un 200: sin el, el navegador recibiria el HTML
  # correcto con un codigo de error. La redireccion interna a /index.html
  # vuelve a entrar por esta misma location y esta vez el archivo existe, asi
  # que no hay ciclo.
  proxy_intercept_errors on;
  error_page 404 = /index.html;
}
