# Reglas de enrutamiento compartidas entre el server block HTTP (80) y el
# HTTPS (443, ver README para como generar el cert local con mkcert). Un solo
# lugar para no tener que mantener los dos bloques en sincro a mano.

# OJO con la barra final en proxy_pass, ver nginx.conf para la explicacion
# completa: sin barra preserva la URL completa (/api/auth/x llega igual con y
# sin Docker).
location /api/ {
  proxy_pass http://backend;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# El health del backend vive en /health, no en /api/health. Se expone aparte
# porque la location / lo mandaria al frontend.
location = /health {
  proxy_pass http://backend/health;
  proxy_set_header Host $host;
}

location = /api-docs {
  return 301 /api-docs/;
}

location /api-docs/ {
  proxy_pass http://backend/api-docs/;
  proxy_set_header Host $host;
}

location / {
  proxy_pass http://frontend/;
  proxy_set_header Host $host;
}
