events {}

# Variante opt-in de nginx.conf que agrega HTTPS en 443, ademas del 80
# normal. No es el archivo que usa `docker compose up` por defecto -- se
# monta explicitamente con `docker-compose.https.yml` (ver README) para no
# arriesgar que Nginx no arranque en la maquina de alguien que no generó
# los certs con mkcert todavia.
http {
  upstream frontend {
    server frontend:80;
  }

  upstream backend {
    server backend:4000;
  }

  server {
    listen 80;

    include /etc/nginx/locations.conf;
  }

  server {
    listen 443 ssl;

    # Generados con mkcert, montados como volumen por
    # docker-compose.https.yml. No se commitean (ver .gitignore).
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    include /etc/nginx/locations.conf;
  }
}
