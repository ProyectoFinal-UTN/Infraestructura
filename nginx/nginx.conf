events {}

http {
  upstream frontend {
    server frontend:80;
  }

  upstream backend {
    server backend:4000;
  }

  server {
    listen 80;

    # OJO con la barra final en proxy_pass.
    #
    # Con `proxy_pass http://backend/;` (CON barra) Nginx reemplaza el prefijo
    # que matcheo la location: /api/auth/x llegaba al backend como /auth/x y
    # daba 404, porque el backend escucha en /api/auth/*.
    #
    # SIN barra final, Nginx preserva la URL completa. Asi las rutas son
    # identicas con Docker y sin Docker: lo que anda en `npm run dev` contra
    # localhost:4000 anda igual detras de Nginx, y nadie tiene que acordarse
    # de que "en Docker las rutas son distintas".
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El health del backend vive en /health, no en /api/health. Se expone
    # aparte porque la location / lo mandaria al frontend.
    location = /health {
      proxy_pass http://backend/health;
      proxy_set_header Host $host;
    }

    location = /api-docs {
      return 301 /api-docs/;
    }

    location /api-docs/ {
      proxy_pass http://backend/api-docs/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://frontend/;
      proxy_set_header Host $host;
    }
  }
}