events {}

http {
  upstream frontend {
    server frontend:80;
  }

  upstream backend {
    server backend:4000;
  }

  server {
    listen 80;

    # Las reglas de /api/, /health, /api-docs/ y / vivian antes aca
    # directo (ver el historial de git si queres el detalle de cada
    # una). Se movieron a locations.conf porque nginx.https.conf
    # (variante opt-in con HTTPS en :443, ver README) las necesita
    # identicas -- con esto hay un solo lugar para tocarlas en vez de
    # mantener dos copias sincronizadas a mano.
    include /etc/nginx/locations.conf;
  }
}
